name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Runs every time you push to main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # THIS IS THE MISSING PIECE: It installs Flutter on the GitHub server
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get # Use 'flutter pub' instead of 'dart pub'

      - name: Build Web
        run: flutter build web --release --base-href "/modern-flutter-todo/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web